# ==============================================================================
# ASCII ONLY -- BU DOSYADA TURKCE KARAKTER KULLANMA
#
# Alembic bu dosyayi Python'un `configparser` modulu ile, isletim sisteminin
# YEREL kodlamasiyla okuyor (`encoding="locale"`). Turkce Windows'ta bu cp1254
# demek ve UTF-8 kodlanmis bir Turkce karakter `UnicodeDecodeError` ile
# migration'i tamamen calismaz hale getiriyor:
#
#     UnicodeDecodeError: 'charmap' codec can't decode byte 0x9e ...
#
# Projedeki diger her dosya UTF-8 ve Turkce yorumlar iceriyor; istisna sadece
# burasi. Aciklamalar icin `alembic/env.py` dosyasina bak.
# ==============================================================================

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os

# Migration dosya adi: 0001_aciklama.py gibi sirali ve okunur olsun.
file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url burada BOS birakildi -- env.py onu .env'deki DATABASE_URL_SYNC
# degiskeninden okuyor. Baglanti stringini ini dosyasina yazmak onu
# commit'lemek demek olurdu.
sqlalchemy.url =

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
