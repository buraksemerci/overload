[project]
name = "overload-api"
version = "0.1.0"
description = "overload — progresif overload merkezli antrenman & sağlık takip API'si"
requires-python = ">=3.11"
dependencies = [
    # Web çatısı
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",

    # Veritabanı
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",          # uygulama (async)
    "psycopg[binary]>=3.2",   # alembic (sync)

    # Kimlik doğrulama
    "fastapi-users[sqlalchemy]>=14.0",

    # AI
    "anthropic>=0.40",

    # Dış servisler
    "httpx>=0.27",            # USDA + Open Food Facts
    "boto3>=1.35",            # Cloudflare R2 (S3 uyumlu)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "asgi-lifespan>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overload_api"]

# --- Ruff (lint + format) ----------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "ASYNC",    # async hataları
    "S",        # bandit (güvenlik)
    "RUF",
]
ignore = [
    "E501",   # satır uzunluğu formatter'a bırakıldı
    "B008",   # FastAPI Depends() varsayılan argümanda zorunlu
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]           # assert testlerde serbest
"alembic/**" = ["I001", "E402"]

# --- pytest ------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:overload_api.*"]

# --- mypy --------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
