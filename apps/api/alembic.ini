[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os

# Migration dosya adı: 0001_aciklama.py gibi sıralı ve okunur olsun.
file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url burada BOŞ bırakıldı — env.py onu .env'deki DATABASE_URL_SYNC'ten
# okur. Bağlantı stringini ini dosyasına yazmak onu commit'lemek demek olurdu.
sqlalchemy.url =

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
